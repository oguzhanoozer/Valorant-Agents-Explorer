name: agents_explorer
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  auto_route: 7.8.4
  dio: 5.4.0
  equatable: 2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 9.0.0
  flutter_svg: ^2.0.17
  get_it: any
  intl: any
  logger: 2.0.2+1
  permission_handler: 11.1.0
  pretty_dio_logger: 1.3.1
  rxdart: 0.28.0
  shared_preferences: 2.5.2
  shimmer: 3.0.0
  stacked: ^3.4.0
  fluttertoast: 8.2.12
  visibility_detector: 0.4.0+2


dev_dependencies:
  auto_route_generator: 7.3.2
  build_runner: 2.4.15
  flutter_lints: 3.0.1
  flutter_test:
    sdk: flutter
  stacked_generator: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/localizations/
