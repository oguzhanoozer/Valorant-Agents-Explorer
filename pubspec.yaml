name: agents_explorer
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  auto_route: 7.8.4
  dio: 5.4.0
  dio_cache_interceptor: 3.5.1
  dio_cache_interceptor_hive_store: 4.0.0
  equatable: 2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 9.0.0
  flutter_svg: ^2.0.17
  get_it: any
  http_mock_adapter: ^0.6.1
  intl: any
  logger: 2.0.2+1
  mockito: 5.4.5
  path_provider: 2.1.5
  pretty_dio_logger: 1.3.1
  rxdart: 0.28.0
  shared_preferences: 2.5.2
  shimmer: 3.0.0
  stacked: ^3.4.0

dev_dependencies:
  auto_route_generator: 7.3.2
  build_runner: 2.4.15
  flutter_lints: 3.0.1
  flutter_test:
    sdk: flutter
  stacked_generator: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/test/
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/localizations/

  fonts:
    - family: EurostileT
      fonts:
        - asset: assets/fonts/eurostileT/EurostileT-Regular.ttf
          weight: 400
        - asset: assets/fonts/eurostileT/EurostileT-Bold.ttf
          weight: 700

    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-ThinItalic.ttf
          weight: 100
          style: italic

        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/roboto/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/roboto/Roboto-BlackItalic.ttf
          weight: 900
          style: italic
